apiVersion: v2
name: clickhouse-cluster
description: >-
  Deploys a ClickHouse cluster (ClickHouseCluster + KeeperCluster CRs) on top of the
  official ClickHouse Kubernetes operator. Includes optional Prometheus ServiceMonitors,
  PrometheusRules, Grafana dashboards, network policies, and managed secrets.
type: application
version: 0.3.0
appVersion: "0.0.3"
kubeVersion: ">=1.28.0-0"
home: https://clickhouse.com
icon: https://clickhouse.com/images/ch_logo.svg
sources:
  - https://github.com/ClickHouse/clickhouse-operator
  - https://github.com/bar19y-oss/clickhouse-s3-guard
# Optional subchart. The repository is a Helm repo *alias*, not a URL, so no
# environment-specific registry is baked into the chart. Add it once per
# environment before `helm dependency build`:
#   helm repo add clickhouse-s3-guard <your-private-helm-repo-url>
dependencies:
  - name: clickhouse-s3-guard
    version: "1.3.0"
    repository: "@clickhouse-s3-guard"
    condition: clickhouse-s3-guard.enabled
keywords:
  - clickhouse
  - database
  - olap
  - analytics
  - keeper
  - zookeeper
  - operator
maintainers:
  - name: PoorTuna
    url: https://github.com/PoorTuna
annotations:
  artifacthub.io/operator: "false"
  artifacthub.io/operatorCapabilities: "Seamless Upgrades"
  artifacthub.io/license: MIT
